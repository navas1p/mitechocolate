{% extends "backend/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0">Edit {{ module.title }}</h4>
</div>
<div class="card">
  <div class="card-body">
  <form method="post">
    {% csrf_token %}
    <div class="row g-3">
      {% for field in form %}
      <div class="col-md-4">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
      {% endfor %}
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Update {{ module.title }}</button>
      <a class="btn btn-outline-secondary" href="{% url 'backend_module_list' module.slug %}">Back</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
