{% extends "backend/base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h4 class="mb-0">Delete {{ module.title }}</h4>
</div>
<div class="card">
  <div class="card-body">
  <p>Are you sure you want to delete <strong>{{ obj }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, Delete</button>
    <a class="btn btn-outline-secondary" href="{% url 'backend_module_list' module.slug %}">Cancel</a>
  </form>
</div>
</div>
{% endblock %}
