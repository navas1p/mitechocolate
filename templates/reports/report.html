{% extends "backend/base.html" %}

{% block content %}
<div class="row">
  <div class="col-12 mb-1">
    <h2 class="text-uppercase mb-0">{{ selected_report_name }}</h2>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="get" action="/reports/{{ slug }}/">
      <div class="row">
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">Report</label>
          <select class="form-control" id="report-selector">
            {% for report_slug, report_name in reports %}
              <option value="{{ report_slug }}" {% if report_slug == slug %}selected{% endif %}>{{ report_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">From</label>
          <input class="form-control" type="date" name="start_date" value="{{ filters.start_date|date:'Y-m-d' }}">
        </div>
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">To</label>
          <input class="form-control" type="date" name="end_date" value="{{ filters.end_date|date:'Y-m-d' }}">
        </div>
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">Customer Group</label>
          <select class="form-control" name="customer_group_id">
            <option value="">All</option>
            {% for g in customer_groups %}
              <option value="{{ g.id }}" {% if filters.customer_group_id == g.id|stringformat:"s" %}selected{% endif %}>{{ g.group_name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">Customer</label>
          <select class="form-control" name="customer_id">
            <option value="">All</option>
            {% for c in customers %}
              <option value="{{ c.id }}" {% if filters.customer_id == c.id|stringformat:"s" %}selected{% endif %}>{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">Courier Partner</label>
          <select class="form-control" name="courier_partner_id">
            <option value="">All</option>
            {% for cp in courier_partners %}
              <option value="{{ cp.id }}" {% if filters.courier_partner_id == cp.id|stringformat:"s" %}selected{% endif %}>{{ cp.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="row mt-1">
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">Product</label>
          <select class="form-control" name="product_id">
            <option value="">All</option>
            {% for p in products %}
              <option value="{{ p.id }}" {% if filters.product_id == p.id|stringformat:"s" %}selected{% endif %}>{{ p.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">Order Type</label>
          <select class="form-control" name="order_type">
            <option value="">All</option>
            {% for value, label in order_types %}
              <option value="{{ value }}" {% if filters.order_type == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">Payment Mode</label>
          <select class="form-control" name="payment_mode">
            <option value="">All</option>
            {% for value, label in payment_modes %}
              <option value="{{ value }}" {% if filters.payment_mode == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-xl-2 col-md-4 col-12 mb-1">
          <label class="font-weight-bold">Group By</label>
          <select class="form-control" name="group_by">
            <option value="day" {% if filters.group_by == "day" %}selected{% endif %}>Day</option>
            <option value="week" {% if filters.group_by == "week" %}selected{% endif %}>Week</option>
            <option value="month" {% if filters.group_by == "month" %}selected{% endif %}>Month</option>
          </select>
        </div>
        <div class="col-xl-4 col-12 d-flex align-items-end mb-1">
          <button class="btn btn-primary mr-1" type="submit">Generate</button>
          <a class="btn btn-outline-danger mr-1" href="/reports/{{ slug }}/export/pdf/?{{ request.GET.urlencode }}">PDF</a>
          <a class="btn btn-outline-success" href="/reports/{{ slug }}/export/excel/?{{ request.GET.urlencode }}">Excel</a>
        </div>
      </div>
    </form>
  </div>
</div>

<div class="card mt-1">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            {% for h in headers %}
              <th>{{ h }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody>
          {% for row in rows %}
            <tr>
              {% for cell in row %}
                <td>{{ cell }}</td>
              {% endfor %}
            </tr>
          {% empty %}
            <tr>
              <td colspan="{{ headers|length }}" class="text-center text-muted">No data for selected filters.</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
  (function () {
    var reportSelector = document.getElementById("report-selector");
    if (!reportSelector) return;
    reportSelector.addEventListener("change", function () {
      var query = window.location.search || "";
      window.location.href = "/reports/" + this.value + "/" + query;
    });
  })();
</script>
{% endblock %}
